services:
  # pgvector image and PostgreSQL 17 use the PostgreSQL License.
  pgvector:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: keyboardstatisticlogin
      POSTGRES_USER: keyboardstatisticlogin
      POSTGRES_PASSWORD: keyboardstatisticlogin
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyboardstatisticlogin -d keyboardstatisticlogin"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  word-frequency:
    build: ./word-frequency
    ports:
      - "8080:8080"
    environment:
      WORD_FREQUENCY_DATABASE_URL: jdbc:postgresql://pgvector:5432/keyboardstatisticlogin
      WORD_FREQUENCY_DATABASE_USERNAME: keyboardstatisticlogin
      WORD_FREQUENCY_DATABASE_PASSWORD: keyboardstatisticlogin
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  pgvector-data:
