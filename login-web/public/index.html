<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your words · KeyboardStatisticLogin</title>
  <link rel="stylesheet" href="page.css">
</head>
<body data-keystrike-url="http://localhost:8080/keystrikes">
  <div class="aurora" aria-hidden="true">
    <i></i>
    <i></i>
    <i></i>
  </div>
  <main class="panel">
    <p class="eyebrow">KeyboardStatisticLogin</p>
    <h1>Your words</h1>
    <p class="lead">Type the words you will use later. Each letter is sent to the profile as you type. A password is not part of the check.</p>
    <form>
      <label for="word">Word</label>
      <input id="word" name="word" type="text" data-word autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
      <button type="submit">Add word</button>
      <p class="status" data-status role="status">Type each letter so the pace can be read.</p>
    </form>
    <h2>Words sent</h2>
    <p class="empty" id="empty">No word sent yet.</p>
    <ul class="words" id="words"></ul>
    <p class="links"><a href="sign-in.html">Sign in</a></p>
  </main>
  <script src="keys.js"></script>
  <script>
    const form = document.querySelector("form");
    const field = window.KeystrikeField.bind(form);
    const list = document.querySelector("#words");
    const empty = document.querySelector("#empty");

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const typed = field.word.value.trim();
      if (typed === "") {
        field.setStatus("Type a word to add it.");
        return;
      }
      field.whenSettled().then(function () {
        if (field.problem()) {
          field.setStatus(field.problem());
          return;
        }
        const item = document.createElement("li");
        item.textContent = typed;
        list.appendChild(item);
        empty.hidden = true;
        field.word.value = "";
        field.setStatus("The word was sent. The pace is now part of the profile.");
      });
    });
  </script>
</body>
</html>
